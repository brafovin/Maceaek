<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Maceaek – Komora testowa</title>
<link rel="stylesheet" href="./ui.css?v=2">
</head>
<body data-screen="title" data-ingame="0">
<canvas id="c" aria-label="Widok gry"></canvas>

<!-- HUD: widoczny w trakcie gry; treść uzupełnia ui.js -->
<div id="hud">
  <div id="crosshair" data-state="idle" aria-hidden="true">
    <svg viewBox="-22 -22 44 44">
      <circle class="ring" r="19.5"/>
      <path class="blob blue"   id="blobBlue"   d="M -5.5 -15 A 16 16 0 0 0 -5.5 15 L -5.5 15 A 12 12 0 0 1 -5.5 -15 Z" fill="#2d9bff" stroke="none"/>
      <path class="blob orange" id="blobOrange" d="M 5.5 -15 A 16 16 0 0 1 5.5 15 L 5.5 15 A 12 12 0 0 0 5.5 -15 Z" fill="#ff8a1f" stroke="none"/>
      <path class="arc blue"   d="M -5.5 -15 A 16 16 0 0 0 -5.5 15"/>
      <path class="arc orange" d="M 5.5 -15 A 16 16 0 0 1 5.5 15"/>
      <circle class="dot" r="1.7"/>
    </svg>
  </div>
  <div id="prompt" data-state="none" role="status">
    <span data-p="pick"><kbd>E</kbd> Podnieś kostkę</span>
    <span data-p="held"><kbd>E</kbd> Upuść <i></i> <kbd>Q</kbd> Rzuć</span>
  </div>

  <div id="levelname"><small id="levelnum"></small><span id="levelnm"></span></div>
  <div id="stats" aria-label="Statystyki poziomu">
    <div id="statTime"><small>Czas</small><b>0:00</b></div>
    <div id="statDeaths"><small>Zgony</small><b>0</b></div>
  </div>
  <div id="timers" aria-label="Przyciski czasowe"></div>
  <div id="legend" aria-hidden="true">
    <span><kbd>WASD</kbd> ruch</span>
    <span><kbd>Spacja</kbd> skok</span>
    <span><kbd>Shift</kbd> bieg</span>
    <span class="b"><kbd>LPM</kbd> niebieski</span>
    <span class="o"><kbd>PPM</kbd> pomarańczowy</span>
    <span><kbd>E</kbd> kostka</span>
    <span><kbd>R</kbd> restart</span>
    <span><kbd>H</kbd> wskazówka</span>
    <span><kbd>Esc</kbd> pauza</span>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="flash"></div>
</div>

<!-- karta wstępna poziomu -->
<div id="intro" role="status" hidden>
  <div class="intro-tag"></div>
  <div class="intro-name"></div>
  <div class="intro-hint"></div>
</div>

<!-- ekrany pełnoekranowe (tytuł, pauza, wybór poziomu, ustawienia, ukończenie) – ui.js -->
<div id="screens" hidden></div>
<div id="notice" role="alert" hidden></div>

<!-- błąd krytyczny (brak WebGL itp.) – wypełnia go game.js lub ui.js -->
<div id="err" role="alert"></div>

<script type="module" src="./game.js"></script>
<script type="module" src="./ui.js"></script>
</body>
</html>
